<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melbourne Magics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe4;--card:#fffaf2;--ink:#2a1c12;--muted:#7a6656;--line:#e5d6c1;
  --accent:#a0521d;--accent2:#c98a4b;--gold:#d4a017;--unrated:#a89888;
  --cafe-ink:#7a3410;--street-ink:#9a8b7c;--street:#fffdf8;--main:#fbe7b0;--mway:#f4c27a;--park-ink:#5f7d47;--land:#f1e7d6;--water:#c9dfe6;--water-ink:#7aa7b7;--park:#d9e5c6;--road:#dccbb0;--cbd:#eadbc4;
  --shadow:0 6px 24px rgba(60,35,15,.14);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17110c;--card:#221a13;--ink:#f3e8da;--muted:#b09c8a;--line:#3a2d22;
  --accent:#e08a4a;--accent2:#c98a4b;--unrated:#6e6156;
  --cafe-ink:#ffc58f;--street-ink:#8f7f70;--street:#3b2e22;--main:#5e4a2c;--mway:#8a5a2b;--park-ink:#7d9a66;--land:#211912;--water:#1d3038;--water-ink:#3f6676;--park:#24301d;--road:#3a2d20;--cbd:#2c2117;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
a.btn{color:inherit}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent2);outline-offset:0}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap;z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-family:Fraunces,serif;font-weight:800;font-size:22px;letter-spacing:-.3px;white-space:nowrap}
.logo span{color:var(--accent)}
.search{flex:1;min-width:200px;max-width:420px;position:relative}
.search input{padding-left:34px;border-radius:999px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.hbtns{display:flex;gap:6px;margin-left:auto;overflow-x:auto}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.app{flex:1;display:flex;min-height:0}
aside{width:390px;flex-shrink:0;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.panel{overflow-y:auto;flex:1;padding:14px 16px 90px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters select{padding:7px 9px;font-size:13.5px}
.chk{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);grid-column:span 2}
.chk input{width:auto}
.note{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.motw{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#a0521d,#d4a017);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;cursor:pointer;border:0;width:100%;text-align:left}
.motw small{opacity:.85;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.motw b{font-family:Fraunces,serif;font-size:18px;display:block}
.motw .big{margin-left:auto;font-family:Fraunces,serif;font-size:26px;font-weight:800}
.count{font-size:12.5px;color:var(--muted);margin:4px 2px 8px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;width:100%;text-align:left}
.item:hover{border-color:var(--accent2)}
.item .nm{font-weight:600}
.item .sb{font-size:12.5px;color:var(--muted)}
.badge{min-width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
.badge.lg{min-width:64px;height:64px;font-size:22px;font-family:Fraunces,serif}
.fav{margin-left:auto;background:none;border:0;font-size:20px;color:var(--unrated);padding:4px}
.fav.on{color:var(--gold)}
.stars{position:relative;display:inline-block;color:var(--line);letter-spacing:1px;line-height:1}
.stars span{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold)}
#mapWrap{flex:1;position:relative;min-width:0;background:var(--water)}
#cv{position:absolute;left:-50%;top:-50%;width:200%;height:200%;transform-origin:0 0;will-change:transform}
#mapWrap{overflow:hidden}
.grab{display:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;transform-origin:0 0;will-change:transform;touch-action:none;cursor:grab;user-select:none}
#map:active{cursor:grabbing}
#map.adding{cursor:crosshair}
.pin{cursor:pointer}
.pin-name{display:none;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:-.1px;paint-order:stroke;stroke:var(--card);stroke-width:3.5px;stroke-linejoin:round;fill:var(--cafe-ink)}
#map.zoomed .pin-name.show{display:block}
.sub-label{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;fill:var(--muted);opacity:.75;pointer-events:none}
.park-label{font-size:10px;font-style:italic;fill:#6c8a52;pointer-events:none}
.sub-label{paint-order:stroke;stroke:var(--land);stroke-width:3px}
.zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:600;box-shadow:var(--shadow)}
.legend{position:absolute;left:14px;bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 28px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.attr{position:absolute;right:8px;bottom:6px;font-size:10.5px;color:var(--muted);background:var(--card);padding:2px 7px;border-radius:6px;opacity:.9}
.attr a{color:inherit}
.addhint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.addhint button{background:none;border:1px solid currentColor;border-radius:999px;padding:3px 10px;font-size:12.5px;color:inherit}
/* detail */
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:0;margin-bottom:10px}
.dh{display:flex;gap:10px;align-items:flex-start}
.dh h2{font-family:Fraunces,serif;font-size:25px;margin:0;line-height:1.15}
.dh .sb{color:var(--muted);font-size:13.5px;margin-top:3px}
.scorebox{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0}
.scorebox .meta{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.actions a.btn{text-decoration:none}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 0 8px}
.bar{display:grid;grid-template-columns:105px 1fr 30px;align-items:center;gap:8px;font-size:13.5px;margin:5px 0}
.bar .tr{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .tr div{height:100%;background:var(--accent2);border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.chip:hover{border-color:var(--accent2)}
.rev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rev .top{display:flex;align-items:center;gap:8px;font-size:13.5px}
.rev .who{font-weight:600}
.rev .when{color:var(--muted);font-size:12px;margin-left:auto}
.rev p{margin:6px 0 0;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.rev .tg{font-size:12px;color:var(--muted);margin-top:5px}
.photos{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.photos img{width:86px;height:86px;object-fit:cover;border-radius:10px;cursor:pointer;flex-shrink:0}
.rev img.rp{width:100%;max-height:190px;object-fit:cover;border-radius:8px;margin-top:8px;cursor:pointer;display:block}
.phprev{display:flex;align-items:center;gap:10px}
.phprev img{width:96px;height:96px;object-fit:cover;border-radius:10px}
.phbtn{display:inline-block;cursor:pointer}
.linkbtn{background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0}
.muted{color:var(--muted);font-size:13.5px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,12,6,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--bg);border-radius:18px;max-width:520px;width:100%;max-height:90dvh;overflow-y:auto;padding:20px 20px 18px;box-shadow:var(--shadow)}
.sheet h2{font-family:Fraunces,serif;margin:0 0 4px;font-size:24px}
.sheet .sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.bigstars{display:flex;gap:4px}
.bigstars button{background:none;border:0;font-size:38px;line-height:1;color:var(--line);padding:0 2px}
.bigstars button.on{color:var(--gold)}
.crit{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.dots{display:flex;gap:5px}
.dots button{width:32px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.dots button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.row .left{margin-right:auto}
label.fl{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.lb .rk{width:22px;color:var(--muted);font-weight:700}
.lb .v{margin-left:auto;font-weight:600}
.lbtn{background:none;border:0;padding:0;text-align:left;font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bdg{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;background:var(--card)}
.bdg b{display:block;font-size:14px}
.bdg.off{opacity:.45}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stats3 div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--muted)}
.stats3 b{display:block;font-family:Fraunces,serif;font-size:24px;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toggle{display:none}
.show-m{display:none}
@media (max-width:820px){
  header{padding:8px 12px;gap:8px}
  .logo{font-size:19px}
  .search{order:3;flex-basis:100%;max-width:none}
  .hbtns{margin-left:auto}
  .btn{padding:7px 11px;font-size:13px}
  .hide-m{display:none}
  .show-m{display:inline}
  .hbtns .btn{padding:7px 10px}
  .app{position:relative;display:block}
  #mapWrap{position:absolute;inset:0}
  aside{position:absolute;left:0;right:0;bottom:0;height:84px;width:auto;border-right:0;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(60,35,15,.18);z-index:6;transition:height .32s cubic-bezier(.2,.8,.2,1);overflow:hidden}
  aside.drag{transition:none}
  .grab{display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 16px 9px;touch-action:none;cursor:grab;flex-shrink:0;min-height:30px}
  .grab i{width:44px;height:5px;border-radius:3px;background:var(--unrated);opacity:.55}
  .grab b{font-size:14.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grab b:empty{display:none}
  .panel{padding-top:2px;overscroll-behavior:contain}
  aside[data-s=half] .panel{overflow-y:hidden}
  aside[data-s=peek] .panel{visibility:hidden}
  #toggle{display:none!important}
  .legend{bottom:96px}
  .attr{bottom:auto;top:6px;right:auto;left:8px}
  body.sheet-up .legend{display:none}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 11h17v8a7 7 0 0 1-7 7h-3a7 7 0 0 1-7-7z" fill="#a0521d"/><path d="M23 13h2.5a3.5 3.5 0 0 1 0 7H23" fill="none" stroke="#a0521d" stroke-width="2.4"/><ellipse cx="14.5" cy="11" rx="8.5" ry="2.2" fill="#f3d9b5"/><path d="M11 3c1.5 2-1 3 .5 5M16 2c1.5 2-1 3.5.5 6" stroke="#c98a4b" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    Melbourne <span>Magics</span>
  </div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Search cafes, suburbs or streets" autocomplete="off">
  </div>
  <div class="hbtns">
    <button class="btn" data-act="explain"><span class="hide-m">What's a Magic?</span><span class="show-m">?</span></button>
    <button class="btn" data-act="leader"><span class="hide-m">Leaderboard</span><span class="show-m">Top</span></button>
    <button class="btn" data-act="mine"><span class="hide-m">My Magics</span><span class="show-m">Mine</span></button>
    <button class="btn primary" data-act="add">+ <span class="hide-m">Add cafe</span><span class="show-m">Add</span></button>
  </div>
</header>
<div class="app">
  <aside id="side"><div class="grab" id="grab"><i></i><b id="grabText"></b></div><div class="panel" id="panel"></div></aside>
  <section id="mapWrap">
    <canvas id="cv"></canvas>
    <svg id="map" aria-label="Map of Melbourne cafes">
      <g id="labels"></g><g id="sublabels"></g><g id="pins"></g><g id="draft"></g>
    </svg>
    <div class="zoom">
      <button data-act="zin" aria-label="Zoom in">+</button>
      <button data-act="zout" aria-label="Zoom out">−</button>
      <button data-act="zreset" aria-label="Reset view" style="font-size:15px">⌂</button>
    </div>
    <div class="legend">
      <span><i style="background:#d4a017"></i>4.5+</span>
      <span><i style="background:#a0521d"></i>4–4.5</span>
      <span><i style="background:#c98a4b"></i>3–4</span>
      <span><i style="background:#b9a48c"></i>under 3</span>
      <span><i style="background:var(--card);box-shadow:inset 0 0 0 2.5px var(--accent)"></i>unrated</span>
    </div>
    <div class="attr">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · Suburbs: data.gov.au</div>
    <div id="addhint" class="addhint" hidden>Tap the map where the cafe is <button data-act="addcancel">Cancel</button></div>
  </section>
</div>
<button id="toggle" class="btn primary" data-act="toggle">List</button>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="streets.js"></script>
<script>
/* ---------- Seed data: well-known Melbourne cafes (approximate locations) ---------- */
const LNG0=144.86,LAT0=-37.75,KY=5745,KX=KY*Math.cos(37.8*Math.PI/180);
const px=lng=>(lng-LNG0)*KX, py=lat=>(LAT0-lat)*KY;
const D=window.MM_DATA||{subs:[],cafes:[],land:""};
const SEED=D.cafes.map(([id,n,si,a,lat,lng,h,w])=>({id,n,s:(D.subs[si]||["Melbourne"])[0],a,lat,lng,h,w,x:px(lng),y:py(lat),seed:true}));
const SUBL=D.subs.map(([n,x,y,cnt,area])=>({n,x,y,cnt,area})).filter(s=>s.x>px(144.58)&&s.x<px(145.36)&&s.y>py(-37.52)&&s.y<py(-38.12)).sort((a,b)=>b.cnt-a.cnt||b.area-a.area);

const CRIT=[["ristretto","Ristretto"],["milk","Milk texture"],["ratio","Ratio"],["temp","Temperature"],["art","Latte art"],["value","Value"]];
const TAGS=["Perfect ratio","Silky milk","Sweet & balanced","Strong","Too milky","Too hot","Burnt","Bitter","Served in a glass","Great art","Fast service","Good value"];
const MILKS=["Full cream","Skim","Oat","Almond","Soy","Lactose free"];
const REPORTS=["Closed down","Wrong location","Not a cafe"];

/* ---------- State ---------- */
const S={db:null,user:null,uid:null,mode:"connecting",isOwner:false,people:{},config:{hidden:[]},favs:[],names:{},
  sel:null,list:null,limit:60,sheet:"peek",q:"",minR:0,suburb:"",sort:"top",favOnly:false,addMode:false,draft:null,panel:false,showReport:false,confirmRm:null,stale:false};
let ST={}; // stats by cafe id
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(v,lo,hi)=>{v=Number(v);return Number.isFinite(v)&&v>=lo&&v<=hi?v:null};
const isMobile=()=>matchMedia("(max-width:820px)").matches;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}
function colour(a){if(a==null)return"var(--unrated)";if(a>=4.5)return"#d4a017";if(a>=4)return"#a0521d";if(a>=3)return"#c98a4b";return"#b9a48c"}
function stars(v,size=15){const p=Math.max(0,Math.min(100,(v||0)/5*100));return`<span class="stars" style="font-size:${size}px">★★★★★<span style="width:${p}%">★★★★★</span></span>`}
function ago(t){const d=(Date.now()-t)/864e5;if(d<1)return"today";if(d<2)return"yesterday";if(d<30)return Math.floor(d)+" days ago";return new Date(t).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"})}
function who(id){return id===S.uid?"You":(S.names[id]||"Someone")}
const okPhoto=v=>typeof v==="string"&&(/^[\w.\-:~]{4,200}$/.test(v)||(S.mode==="local"&&v.startsWith("data:image/")));
const photoSrc=v=>v.startsWith("data:image/")?v:S.backend==="supabase"?S.photoBase+v.split(":").map(encodeURIComponent).join("/"):"/_blob/"+encodeURIComponent(v);
const canRate=()=>S.mode==="live"||S.mode==="local";

/* ---------- Data ---------- */
let CACHE=null;
function rebuild(){
  const out=SEED.slice();
  for(const [uid,p] of Object.entries(S.people)){
    const cs=p&&typeof p.cafes==="object"?p.cafes:{};
    for(const [id,c] of Object.entries(cs)){
      if(!c||typeof c.n!=="string")continue;
      const lat=num(c.lat,-38.12,-37.52),lng=num(c.lng,144.58,145.36);
      if(lat==null||lng==null)continue;
      out.push({id,n:c.n.slice(0,60),s:String(c.s||"").slice(0,40)||"Melbourne",a:String(c.a||"").slice(0,80),lat,lng,x:px(lng),y:py(lat),by:uid});
    }
  }
  const hidden=new Set(Array.isArray(S.config.hidden)?S.config.hidden:[]);
  CACHE={all:out,vis:out.filter(c=>!hidden.has(c.id)),map:new Map(out.map(c=>[c.id,c]))};
}
function allCafes(includeHidden){if(!CACHE)rebuild();return includeHidden?CACHE.all:CACHE.vis}
const cafeById=id=>{if(!CACHE)rebuild();return CACHE.map.get(id)};
function computeStats(){

const avgOf=id=>ST[id]&&ST[id].n?ST[id].avg:null;

function filtered(){
  const q=S.q.trim().toLowerCase();
  let list=allCafes().filter(c=>{
    if(q&&!(c.n+" "+c.s+" "+c.a).toLowerCase().includes(q))return false;
    if(S.suburb&&c.s!==S.suburb)return false;
    if(S.favOnly&&!S.favs.includes(c.id))return false;

  });
  const n=id=>ST[id]?ST[id].n:0;
  if(S.sort==="top")list.sort((a,b)=>(avgOf(b.id)??-1)-(avgOf(a.id)??-1)||n(b.id)-n(a.id)||a.n.localeCompare(b.n));
  if(S.sort==="most")list.sort((a,b)=>n(b.id)-n(a.id)||a.n.localeCompare(b.n));
  if(S.sort==="az")list.sort((a,b)=>a.n.localeCompare(b.n));

}

    for(let i=0;i<n;i++){x+=a[2+2*i];y+=a[3+2*i];const X=x/10,Y=y/10;pt[2*i]=X;pt[2*i+1]=Y;if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y}

    for(let gx=Math.floor(x0/GC);gx<=Math.floor(x1/GC);gx++)for(let gy=Math.floor(y0/GC);gy<=Math.floor(y1/GC);gy++){
      const k=gx*100000+gy;let c=GRID.get(k);if(!c)GRID.set(k,c=[]);c.push(o)}

    <h3>Badges</h3><div class="badges">${B.map(([n,d,on])=>`<div class="bdg ${on?"":"off"}"><b>${on?"🏅 ":""}${n}</b>${d}</div>`).join("")}</div>
    <h3>Favourites</h3>${S.favs.length?`<div class="chips">${S.favs.map(id=>cafeById(id)).filter(Boolean).map(c=>`<button class="chip" data-act="go" data-id="${esc(c.id)}">★ ${esc(c.n)}</button>`).join("")}</div>`:`<p class="muted">Tap ★ on a cafe to save it here.</p>`}
    <h3>Log</h3>${my.length?my.map(([id,r])=>{const c=cafeById(id);return c?`<div class="lb"><button class="lbtn" data-act="go" data-id="${esc(id)}">${esc(c.n)}</button><span class="muted">${ago(r.t||0)}</span><span class="v">${stars(r.o,13)}</span></div>`:""}).join(""):`<p class="muted">You haven't rated any Magics yet.</p>`}
    ${hidden.length?`<h3>Hidden cafes (owner)</h3>${hidden.map(c=>`<div class="lb"><span>${esc(c.n)}</span><button class="btn small" style="margin-left:auto" data-act="unhide" data-id="${esc(c.id)}">Unhide</button></div>`).join("")}`:""}
    <div class="row">${S.backend==="supabase"?(S.uid?`<button class="btn left" data-act="name">Change name</button><button class="btn" data-act="signout">Sign out</button>`:`<button class="btn left" data-act="signin2">Sign in</button>`):""}<button class="btn" data-act="close">Close</button></div>`,
  (act,b)=>{if(act==="go"){closeModal();select(b.dataset.id,true)}if(act==="unhide"){setHidden(b.dataset.id,false);openMine()}
    if(act==="signin2")openSignin();if(act==="name")openName();if(act==="signout")S.sb.auth.signOut().catch(()=>{}).then(()=>location.reload())});
}
let R=null,rateId=null;
async function shrink(file){
  try{const bmp=await createImageBitmap(file),s=Math.min(1,1400/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));return b||file}catch(e){return file}
}
const toDataUrl=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});
async function dropAsset(id){if(S.assets&&id&&!id.startsWith("data:")){try{await S.assets.delete(id)}catch(e){}}}
function openRate(id){
  if(!canRate())return;
  rateId=id;const ex=(S.people[S.uid]?.reviews||{})[id];
  R={o:num(ex?.o,1,5)||0,milk:MILKS.includes(ex?.milk)?ex.milk:"Full cream",price:ex?.price??"",text:typeof ex?.text==="string"?ex.text:"",
     ph:okPhoto(ex?.ph)?ex.ph:"",oldPh:okPhoto(ex?.ph)?ex.ph:"",file:null,preview:"",busy:false};
  drawRate(!!ex);
}
function drawRate(existing){
  const c=cafeById(rateId),canPhoto=!!S.assets||S.mode==="local",img=R.preview||(R.ph?photoSrc(R.ph):"");
  openModal(`<h2>Rate the Magic</h2><p class="sub">${esc(c.n)}, ${esc(c.s)}</p>
    <label class="fl">Rating</label>
    <div class="bigstars">${[1,2,3,4,5].map(i=>`<button data-act="o" data-v="${i}" class="${R.o>=i?"on":""}" aria-label="${i} stars">★</button>`).join("")}</div>
    <label class="fl">Milk</label>
    <div class="chips">${MILKS.map(m=>`<button class="chip ${R.milk===m?"on":""}" data-act="milk" data-v="${m}">${m}</button>`).join("")}</div>
    <label class="fl" for="rPrice">Price paid ($)</label>
    <input id="rPrice" type="number" step="0.1" min="1" max="20" inputmode="decimal" placeholder="e.g. 5.50" value="${esc(R.price)}" style="max-width:140px">
    <label class="fl" for="rText">Review <span class="muted" style="font-weight:400">(optional, <span id="rCount">${280-R.text.length}</span> left)</span></label>
    <textarea id="rText" rows="3" maxlength="280" placeholder="How was it?">${esc(R.text)}</textarea>
    ${canPhoto?`<label class="fl">Photo <span class="muted" style="font-weight:400">(optional)</span></label>
      ${img?`<div class="phprev"><img src="${esc(img)}" alt="Your photo"><button class="btn small" data-act="phrm">Remove photo</button></div>`
           :`<label class="btn phbtn">Add a photo<input id="rFile" type="file" accept="image/*" hidden></label>`}`:""}
    <div class="row">${existing?`<button class="btn left" data-act="del">Delete my rating</button>`:""}<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save" ${R.busy?"disabled":""}>${R.busy?"Saving…":"Save rating"}</button></div>`,
  async(act,b)=>{
    const v=b.dataset.v;if(R.busy)return;
    if(act==="o"){R.o=+v;drawRate(existing)}
    if(act==="milk"){R.milk=v;drawRate(existing)}
    if(act==="phrm"){if(R.preview)URL.revokeObjectURL(R.preview);R.file=null;R.preview="";R.ph="";drawRate(existing)}
    if(act==="save"){
      if(!R.o)return toast("Pick a star rating first.");
      const id=rateId;let ph=R.ph,photoFailed=false;
      if(R.file){
        R.busy=true;drawRate(existing);
        try{const blob=await shrink(R.file);
          if(S.assets){const up=await S.assets.upload(blob);ph=up&&up.id?String(up.id):"";if(!okPhoto(ph)){ph="";photoFailed=true}}
          else ph=await toDataUrl(blob);
        }catch(e){ph=R.oldPh;photoFailed=true}
        R.busy=false;
      }
      const rec={o:R.o,milk:R.milk,price:num(parseFloat(R.price),1,20),text:String(R.text).trim().slice(0,280),t:Date.now()};
      if(ph)rec.ph=ph;
      const old=R.oldPh;closeModal();
      const ok=await saveMine(cur=>{cur.reviews={...(cur.reviews||{}),[id]:rec}});
      if(ok&&old&&old!==ph)dropAsset(old);
      if(ok)toast(photoFailed?"Rating saved, but the photo couldn't be uploaded.":"Rating saved. Thanks!");
    }
    if(act==="del"){const id=rateId,old=R.oldPh;closeModal();const ok=await saveMine(cur=>{if(cur.reviews)delete cur.reviews[id]});if(ok){dropAsset(old);toast("Rating deleted.")}}
  });
  $("#rText").addEventListener("input",e=>{R.text=e.target.value;$("#rCount").textContent=280-R.text.length});
  $("#rPrice").addEventListener("input",e=>{R.price=e.target.value});
  const fi=$("#rFile");if(fi)fi.addEventListener("change",e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    if(!f.type.startsWith("image/"))return toast("Choose an image file.");
    if(f.size>20*1024*1024)return toast("That photo is too big (20 MB max).");
    R.file=f;R.preview=URL.createObjectURL(f);drawRate(existing)});
}
function openAdd(){
  const subs=SUBL.map(s=>s.n).sort();
  openModal(`<h2>Add a missing cafe</h2><p class="sub">It'll appear on the map for everyone, marked as community added.</p>
    <label class="fl" for="aName">Cafe name</label><input id="aName" maxlength="60" placeholder="e.g. The Corner Cup">
    <label class="fl" for="aSub">Suburb</label><input id="aSub" maxlength="40" list="subList" placeholder="e.g. Fitzroy"><datalist id="subList">${subs.map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
    <label class="fl" for="aAddr">Street address <span class="muted" style="font-weight:400">(optional)</span></label><input id="aAddr" maxlength="80" placeholder="e.g. 12 Smith St">
    <div class="row"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="addsave">Add cafe</button></div>`,
  async act=>{

/* ---------- Events ---------- */
document.addEventListener("click",async e=>{
  if(e.target.closest("#modal"))return;
  if(performance.now()-dragEnd<350&&e.target.closest("#side"))return;
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==="fav"){e.stopPropagation();return toggleFav(id)}
  if(act==="sel")return select(id,true);
  if(act==="back"){S.sel=null;return render()}
  if(act==="more"){S.limit+=120;return render()}
  if(act==="rate")return openRate(id);
  if(act==="explain")return openExplain();
  if(act==="leader")return openLeader();
  if(act==="mine")return openMine();
  if(act==="signin")return openSignin();
  if(act==="add"){if(!canRate()&&S.backend==="supabase"&&!S.uid)return openSignin();if(!canRate())return toast(S.mode==="connecting"?"Still loading, try again in a moment.":"You need permission to add cafes.");S.addMode=true;S.sheet="peek";return render()}
  if(act==="addcancel"){S.addMode=false;S.draft=null;drawDraft();return render()}
  if(act==="zin")return zoomCentre(0.7);
  if(act==="zout")return zoomCentre(1.4);
  if(act==="zreset")return goHome();
  if(act==="toggle"){S.sheet=S.sheet==="peek"?"half":"peek";return render()}
  if(act==="photo"){const src=b.dataset.src;if(/^(\/_blob\/|data:image\/)/.test(src)||(S.photoBase&&src.startsWith(S.photoBase)))openModal(`<img src="${esc(src)}" alt="Magic photo" style="width:100%;border-radius:12px;display:block"><div class="row"><button class="btn" data-act="close">Close</button></div>`);return}
  if(act==="showreport"){S.showReport=true;return render()}
  if(act==="report"){const why=b.dataset.why;S.showReport=false;const ok=await saveMine(cur=>{cur.reports={...(cur.reports||{}),[id]:why}});if(ok)toast("Thanks, reported.");return}
  if(act==="hide")return setHidden(id,!(S.config.hidden||[]).includes(id));
  if(act==="rm"){const u=b.dataset.uid;if(S.confirmRm!==u+id){S.confirmRm=u+id;return render()}S.confirmRm=null;const oldPh=S.people[u]?.reviews?.[id]?.ph;const ok=await saveOther(u,cur=>{if(cur.reviews)delete cur.reviews[id]});if(ok){if(okPhoto(oldPh))dropAsset(oldPh);toast("Review removed.")}return}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("item"))select(e.target.dataset.id,true)});
$("#panel").addEventListener("change",e=>{
  if(e.target.id==="fSort")S.sort=e.target.value;
  if(e.target.id==="fMin")S.minR=+e.target.value;
  if(e.target.id==="fSub"){S.suburb=e.target.value;const s=SUBL.find(q=>q.n===S.suburb);if(s)centreOn(s.x,s.y,Math.max(120,Math.min(900,Math.sqrt(s.area)*260)))}
  S.limit=60;
  if(e.target.id==="fFav")S.favOnly=e.target.checked;
  render();
});
$("#q").addEventListener("input",e=>{S.q=e.target.value;S.sel=null;S.limit=60;if(isMobile()&&S.q)S.sheet="full";render()});

/* ---------- Boot ---------- */
buildBase();setVB();goHome();renderAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{TW.clear();drawBase()});
async function refreshNames(){
  const ids=Object.keys(S.people).filter(id=>!(id in S.names)&&id!==S.uid);
  if(!ids.length||!S.user||!S.user.profiles)return;
  ids.forEach(id=>S.names[id]="");
  try{const ps=await S.user.profiles(ids);ids.forEach(id=>S.names[id]=(ps&&ps[id]&&ps[id].name)||"");render()}catch(e){}
}
/* ---------- Own-website storage (Supabase), used when config.js is filled in ---------- */
function openSignin(){
  openModal(`<h2>Sign in</h2><p class="sub">We'll email you a sign-in link. No password needed.</p>
    <label class="fl" for="sEmail">Email</label><input id="sEmail" type="email" autocomplete="email" placeholder="you@example.com">
    <div class="row"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="send">Send link</button></div>`,
  async act=>{
    if(act!=="send")return;const em=$("#sEmail").value.trim();
    if(!/^\S+@\S+\.\S+$/.test(em))return toast("Enter a valid email.");
    let error=null;try{({error}=await S.sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}}))}catch(e){error=e}
    if(error)return toast("Couldn't send the link. Wait a minute and try again.");
    openModal(`<h2>Check your email</h2><p>A sign-in link is on its way to ${esc(em)}. Open it on this device.</p><div class="row"><button class="btn primary" data-act="close">OK</button></div>`);
  });
  setTimeout(()=>$("#sEmail")&&$("#sEmail").focus(),50);
}
function openName(){
  const cur=String(S.people[S.uid]?.name||"");
  openModal(`<h2>Your display name</h2><p class="sub">Shown next to your reviews.</p>
    <input id="nName" maxlength="30" placeholder="e.g. Sam from Fitzroy" value="${esc(cur)}">
    <div class="row"><button class="btn" data-act="close">Later</button><button class="btn primary" data-act="nsave">Save</button></div>`,
  async act=>{if(act!=="nsave")return;const n=$("#nName").value.trim().slice(0,30);if(!n)return toast("Enter a name.");closeModal();
    const ok=await saveMine(cur=>{cur.name=n});if(ok)toast("Name saved.")});
}
async function sbInit(){
  const C=window.MM_CONFIG||{};
  if(!/^https:\/\/[\w.-]+$/.test(C.supabaseUrl||"")||!C.supabaseKey)return null;
  try{
    if(!window.supabase)await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;s.onerror=rej;document.head.appendChild(s)});
    const sb=window.supabase.createClient(C.supabaseUrl,C.supabaseKey);S.sb=sb;S.backend="supabase";
    S.photoBase=C.supabaseUrl+"/storage/v1/object/public/photos/";
    const ses=await sb.auth.getSession();const uid=ses&&ses.data&&ses.data.session?ses.data.session.user.id:null;
    let admin=false;
    if(uid){try{const r=await sb.from("admins").select("user_id").eq("user_id",uid);admin=!!(r.data&&r.data.length)}catch(e){}}
    sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"||(ev==="SIGNED_IN"&&!uid))location.reload()});
    const fail=error=>{throw{code:error&&(error.code==="42501"||error.status===401||error.status===403)?"invalid_argument":"unavailable"}};
    const up=async(table,row)=>{const {error}=await sb.from(table).upsert(row);if(error)fail(error)};
    const snap=(row)=>({id:row?row.id:"",exists:!!row,data:()=>row?row.data||{}:undefined,metadata:{fromCache:false}});
    let peopleCb=null,peopleErr=null;
    const loadPeople=async()=>{const {data,error}=await sb.from("people").select("id,data");
      if(error){peopleErr&&peopleErr({code:"unavailable"});return}
      peopleCb&&peopleCb({docs:(data||[]).map(snap),metadata:{fromCache:false}})};
    const one=(table,id,cb)=>{sb.from(table).select("id,data").eq("id",id).then(({data})=>cb(snap(data&&data[0])),()=>{})};
    const db={
      doc(path){const p=path.split("/");
        if(p[0]==="people")return{set:d=>up("people",{id:p[1],data:d,updated_at:new Date().toISOString()})};
        if(p[0]==="config")return{set:d=>up("site",{id:"site",data:d}),onSnapshot(cb){one("site","site",cb);return()=>{}}};
        return{set:d=>up("prefs",{id:p[2],data:d}),onSnapshot(cb){one("prefs",p[2],cb);return()=>{}}}},
      collection(){return{onSnapshot(cb,err){peopleCb=cb;peopleErr=err;loadPeople();return()=>{}}}}
    };
    window.addEventListener("focus",()=>{loadPeople()});
    const user={id:async()=>uid,isOwner:async()=>admin,can:async()=>!!uid,
      profiles:async ids=>Object.fromEntries(ids.map(i=>[i,{name:String((S.people[i]&&S.people[i].name)||"").slice(0,30)}]))};
    const assets=uid?{
      async upload(blob){const path=uid+"/"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+".jpg";
        const {error}=await sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg"});if(error)throw error;return{id:path.replace("/",":")}},
      async delete(id){await sb.storage.from("photos").remove([id.replace(":","/")])}
    }:null;
    return{db,user,assets};
  }catch(e){S.backend="";return null}
}
let nameAsked=false;
(async()=>{
  const use=window.claude&&window.claude.use;
  let db,user,assets;
  if(!use){
    const own=await sbInit();
    if(!own){S.mode="local";S.uid="local";return render()}
    ({db,user,assets}=own);
  }else [db,user,assets]=await Promise.all(["db","user","assets"].map(n=>window.claude.use(n).catch(()=>null)));
  S.user=user;S.assets=assets;
  if(!db){S.mode="local";S.uid="local";return render()}
  S.db=db;
  try{S.uid=user?await user.id():null}catch(e){S.uid=null}
  try{S.isOwner=user?!!(await user.isOwner()):false}catch(e){}
  let cw=null;try{cw=user&&user.can?await user.can("data.write"):null}catch(e){}
  S.mode=!S.uid?"readonly":(cw===false?"readonly":"live");
  if(S.isOwner&&S.uid)S.mode="live";
  render();
  const timer=setTimeout(()=>{S.stale=true;render()},10000);
  db.collection("people").onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{if(d.exists)next[d.id]=d.data()});
    S.people=next;if(!snap.metadata.fromCache){clearTimeout(timer);S.stale=false}
    render();refreshNames();
    if(S.backend==="supabase"&&S.uid&&!nameAsked&&!(S.people[S.uid]&&S.people[S.uid].name)&&$("#modal").hidden){nameAsked=true;openName()}
  },err=>{clearTimeout(timer);S.stale=true;render()});
  db.doc("config/site").onSnapshot(d=>{S.config=d.exists&&d.data()?{hidden:[],...d.data()}:{hidden:[]};render()},()=>{});
  if(S.uid)db.doc("data/users/"+S.uid+"/prefs").onSnapshot(d=>{const f=d.exists&&d.data()&&d.data().favs;S.favs=Array.isArray(f)?f.filter(x=>typeof x==="string"):[];render()},()=>{});
})();
